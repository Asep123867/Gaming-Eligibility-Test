
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Secret Door</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 30px 16px;
      font-family: "Segoe UI", Arial, sans-serif;
      color: #17233f;
      background:
        radial-gradient(circle at top left, #dceaff, transparent 40%),
        linear-gradient(135deg, #f8fbff, #eaf1ff);
    }

    .container {
      width: 100%;
      max-width: 650px;
      padding: 45px 35px;
      text-align: center;
      background: rgba(255, 255, 255, 0.82);
      border: 1px solid rgba(255, 255, 255, 0.9);
      border-radius: 28px;
      box-shadow: 0 20px 60px rgba(50, 80, 140, 0.12);
      animation: appear 0.8s ease;
    }

    h1 {
      font-size: clamp(30px, 6vw, 46px);
      margin-bottom: 20px;
      letter-spacing: -1.5px;
    }

    .lock {
      font-size: 32px;
      margin: 12px 0 25px;
    }

    .description {
      color: #53627f;
      font-size: 17px;
      line-height: 1.9;
      margin-bottom: 28px;
    }

    .input-wrap {
      position: relative;
      margin: 25px 0 16px;
    }

    input {
      width: 100%;
      padding: 17px 18px;
      border: 2px solid #d4e0f5;
      border-radius: 14px;
      outline: none;
      background: white;
      font-size: 16px;
      color: #17233f;
      transition: 0.25s;
    }

    input:focus {
      border-color: #477dff;
      box-shadow: 0 0 0 4px rgba(71, 125, 255, 0.12);
    }

    button {
      width: 100%;
      padding: 17px;
      margin-top: 8px;
      border: none;
      border-radius: 14px;
      background: linear-gradient(135deg, #5c8cff, #3168ef);
      color: white;
      font-size: 18px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 8px 20px rgba(49, 104, 239, 0.25);
      transition: transform 0.2s, box-shadow 0.2s;
    }

    button:hover {
      transform: translateY(-3px);
      box-shadow: 0 12px 25px rgba(49, 104, 239, 0.32);
    }

    button:active {
      transform: scale(0.98);
    }

    .door {
      display: block;
      width: min(280px, 80%);
      height: auto;
      margin: 35px auto 10px;
      filter: drop-shadow(0 12px 12px rgba(40, 60, 100, 0.12));
      animation: float 3s ease-in-out infinite;
    }

    #message {
      min-height: 24px;
      margin-top: 15px;
      font-size: 14px;
      color: #e05252;
    }

    .footer {
      margin-top: 25px;
      font-size: 12px;
      color: #9aa7bf;
    }

    @keyframes appear {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }

    @media (max-width: 480px) {
      .container {
        padding: 32px 22px;
      }

      .description {
        font-size: 15px;
      }
    }
  </style>
</head>

<body>
  <main class="container">
    <h1>Hi, nice to meet you!</h1>

    <div class="lock">🔐</div>

    <p class="description">
      You want to open the door?<br>
      Oh, you need the code.<br>
      I remembered someone said<br>
      you need to inspect some console...
    </p>

    <form id="codeForm">
      <div class="input-wrap">
        <input
          type="text"
          id="y"
          placeholder="Enter the secret code..."
          autocomplete="off"
          aria-label="Secret code"
          required
        >
      </div>

      <button type="submit">🛡️ Verify</button>
      <p id="message" role="status"></p>
    </form>

    <img
      class="door"
      src="https://png.pngtree.com/png-clipart/20230110/original/pngtree-door-clipart-png-image_8900949.png"
      alt="A mysterious door"
    >

    <p class="footer">✦ A little mystery awaits you ✦</p>
  </main>

  <script>
    const x = "1502116754321";

    console.log("🔑 Secret code:", x);

    document.getElementById("codeForm").addEventListener("submit", function(event) {
      event.preventDefault();

      const y = document.getElementById("y").value.trim();
      const message = document.getElementById("message");

      if (y === x) {
        message.style.color = "#21865b";
        message.textContent = "Correct! Opening the door...";

        setTimeout(() => {
          location.href = "tekateki-pintukebuka.html";
        }, 700);
      } else {
        message.textContent = "Incorrect code. Try again! 🔒";
      }
    });
  </script>
</body>
</html>
