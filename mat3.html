<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">

    <title>MATH CHALLENGE - LEVEL 03</title>

    <style>

        body {

            font-weight: 700;
            letter-spacing: 1px;
            margin-bottom: 15px;
        }

        h1 {
            font-size: 28px;
            margin-bottom: 12px;
            color: #172554;
        }

        .description {
            color: #7b8499;
            font-size: 14px;
            line-height: 1.7;
        }

        .question {
            margin: 28px 0 20px;
            background: #f8faff;
            border: 1px solid #e7edff;
            border-radius: 18px;
            padding: 25px 15px;
        }

        .question-label {
            color: #8490a8;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 1.5px;
            margin-bottom: 15px;
        }

        .math {
            font-size: 25px;
            font-weight: 800;
            color: #254cc7;
            line-height: 1.8;
            overflow-wrap: anywhere;
        }

        .hint {
            font-size: 12px;
            color: #8992a5;

        }

        textarea {
            width: 100%;
            height: 55px;
            resize: none;
            border: 2px solid #e0e6f2;
            border-radius: 12px;
            padding: 15px;
            font-size: 18px;
            text-align: center;
            outline: none;
            transition: 0.25s;
            color: #172554;
        }

        textarea:focus {
            border-color: #3867f4;

        }

        button {
            width: 100%;
            margin-top: 16px;

        }
    </style>
</head>

<body>
    <main class="container">

        <div class="icon">∑</div>

        <span class="tag">LEVEL 03</span>

        <h1>MATH CHALLENGE</h1>

        <p class="description">
            You're doing great!<br>
            Solve this challenging equation to continue.
        </p>

        <div class="question">
            <p class="question-label">SOLVE THIS QUESTION</p>

            <div class="math">
                123 + 456 × 345 − 9250 ÷ 37 − 72 × 1945
            </div>
        </div>

        <p class="hint">
            Don't use dots or commas in your answer.
        </p>

        <textarea
            id="C"
            placeholder="Enter your answer"
            aria-label="Your answer"
        ></textarea>

        <button onclick="jawaban3()" type="button" id="tombol3">
            CHECK ANSWER →
        </button>

        <p id="hasil3" role="status" aria-live="polite"></p>

        <a id="next3" href="riddle.html">NEXT LEVEL →</a>

        <p class="footer">MATH CHALLENGE · THINK SMARTER</p>

    </main>

    <script>
        function jawaban3() {
            const textarea3 = document.getElementById("C");
            const tombol3 = document.getElementById("tombol3");
            const hasil3 = document.getElementById("hasil3");
            const next3 = document.getElementById("next3");

            const jawabanUser = textarea3.value.trim();
            const ans3 = 17153;

            if (jawabanUser === "") {
                hasil3.innerText = "Please enter your answer first!";
                hasil3.style.color = "#e59b16";
                next3.style.display = "none";
                return;
            }

            if (/^-?\d+$/.test(jawabanUser) &&
                Number(jawabanUser) === ans3) {

                hasil3.innerText = "✓ CORRECT! Excellent work!";
                hasil3.style.color = "#16a05d";

                next3.style.display = "block";

                tombol3.innerText = "ANSWER CORRECT ✓";
                tombol3.style.background = "#16a05d";
                tombol3.disabled = true;
                textarea3.disabled = true;

            } else {
                hasil3.innerText = "✗ INCORRECT! Try again.";
                hasil3.style.color = "#e5484d";
                next3.style.display = "none";
            }
        }

        document.getElementById("C").addEventListener("keydown", function(event) {
            if (event.key === "Enter") {
                event.preventDefault();
                jawaban3();
            }
        });
    </script>
</body>
</html>
