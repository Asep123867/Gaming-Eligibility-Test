<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MATH CHALLENGE - LEVEL 02</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: #f5f7ff;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: #1e293b;
        }

        .container {
            background: white;
            width: 100%;
            max-width: 450px;
            padding: 40px 30px;
            border-radius: 24px;
            text-align: center;
            box-shadow: 0 15px 50px rgba(35, 58, 120, 0.10);
            border: 1px solid #e8edfa;
            animation: appear 0.6s ease;
        }

        .icon {
            width: 75px;
            height: 75px;
            background: #eaf0ff;
            color: #3867f4;
            border-radius: 22px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 38px;
            font-weight: bold;
            margin: 0 auto 20px;
        }

        .tag {
            display: inline-block;
            padding: 7px 14px;
            border-radius: 30px;
            background: #eef2ff;
            color: #3867f4;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 1px;
            margin-bottom: 15px;
        }

        h1 {
            font-size: 28px;
            margin-bottom: 12px;
            color: #172554;
        }

        .description {
            color: #7b8499;
            font-size: 14px;
            line-height: 1.7;
        }

        .question {
            margin: 28px 0 20px;
            background: #f8faff;
            border: 1px solid #e7edff;
            border-radius: 18px;
            padding: 25px 15px;
        }

        .question-label {
            color: #8490a8;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 1.5px;
            margin-bottom: 12px;
        }

        .math {
            font-size: 36px;
            font-weight: 800;
            color: #254cc7;
            letter-spacing: 1px;
        }

        .hint {
            font-size: 12px;
            color: #8992a5;
            margin: 20px 0 10px;
        }

        textarea {
            width: 100%;
            height: 55px;
            resize: none;
            border: 2px solid #e0e6f2;
            border-radius: 12px;
            padding: 15px;
            font-size: 18px;
            text-align: center;
            outline: none;
            transition: 0.25s;
            color: #172554;
        }

        textarea:focus {
            border-color: #3867f4;
            box-shadow: 0 0 0 4px rgba(56, 103, 244, 0.10);
        }

        button {
            width: 100%;
            margin-top: 16px;
            padding: 16px;
            border: none;
            border-radius: 12px;
            background: #3867f4;
            color: white;
            font-size: 14px;
            font-weight: 700;
            letter-spacing: 1px;
            cursor: pointer;
            transition: 0.25s;
        }

        button:hover:not(:disabled) {
            background: #254cc7;
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(56, 103, 244, 0.25);
        }

        #hasil2 {
            margin-top: 20px;
            font-size: 15px;

        #next2 {
            display: none;

            border-radius: 12px;
            background: #e8f9ef;
            color: #16834a;
            text-decoration: none;
            font-weight: 700;
            transition: 0.2s;
        }

        #next2:hover {
            background: #d4f5e1;
            transform: translateY(-2px);
        }

        .footer {
            margin-top: 28px;
            color: #a0a8ba;
            font-size: 11px;
        }

        @keyframes appear {
            from {
                opacity: 0;
                transform: translateY(18px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 400px) {
            .container {
                padding: 30px 20px;
            }

            h1 {
                font-size: 24px;
            }

            .math {
                font-size: 30px;
            }
        }
    </style>
</head>

<body>
    <main class="container">

        <div class="icon">∑</div>

        <span class="tag">LEVEL 02</span>

        <h1>MATH CHALLENGE</h1>

        <p class="description">
            Great job getting this far!<br>
            Solve the next question to continue.
        </p>

        <div class="question">
            <p class="question-label">SOLVE THIS QUESTION</p>
            <div class="math">66051 ÷ 123</div>
        </div>

        <p class="hint">Don't use dots or commas in your answer.</p>

        <textarea
            id="B"
            placeholder="Enter your answer"
            aria-label="Your answer"
        ></textarea>

        <button onclick="jawaban2()" id="tombol2" type="button">
            CHECK ANSWER →
        </button>

        <p id="hasil2" role="status" aria-live="polite"></p>

        <a href="mat3.html" id="next2">NEXT LEVEL →</a>

        <p class="footer">MATH CHALLENGE · THINK SMARTER</p>

    </main>

    <script>
        function jawaban2() {
            const textarea2 = document.getElementById("B");
            const tombol2 = document.getElementById("tombol2");
            const hasil2 = document.getElementById("hasil2");
            const next2 = document.getElementById("next2");

            const jawabanUser = textarea2.value.trim();
            const ans2 = 537;

            if (jawabanUser === "") {
                hasil2.innerText = "Please enter your answer first!";
                hasil2.style.color = "#e59b16";
                next2.style.display = "none";
                return;
            }

            if (/^\d+$/.test(jawabanUser) &&
                Number(jawabanUser) === ans2) {

                hasil2.innerText = "✓ CORRECT! Excellent work!";
                hasil2.style.color = "#16a05d";

                next2.style.display = "block";

                tombol2.innerText = "ANSWER CORRECT ✓";
                tombol2.style.background = "#16a05d";
                tombol2.disabled = true;
                textarea2.disabled = true;

            } else {
                hasil2.innerText = "✗ INCORRECT! Try again.";
                hasil2.style.color = "#e5484d";
                next2.style.display = "none";
            }
        }

        document.getElementById("B").addEventListener("keydown", function(event) {
            if (event.key === "Enter") {
                event.preventDefault();
                jawaban2();
            }
        });
    </script>
</body>
</html>
